<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Application Tracker{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'applications:application_list' %}">💼 Job Tracker</a>
            <div class="d-flex align-items-center text-white">
                {% if user.is_authenticated %}
                    <span class="me-3 text-secondary">Logged in as: <strong>{{ user.username }}</strong></span>
                    <a href="/admin/logout/" class="btn btn-outline-light btn-sm">Log out</a>
                {% else %}
                    <a href="/admin/login/" class="btn btn-outline-light btn-sm">Log in</a>
                {% endif %}
            </div>
        </div>
    </nav>

    
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
